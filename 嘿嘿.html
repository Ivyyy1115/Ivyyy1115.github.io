<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>你是谁呀</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { color: #333; border-left: 5px solid #007bff; padding-left: 10px; }
        .question { margin: 20px 0; padding: 15px; background: #fafafa; border-radius: 8px; }
        label { display: block; margin: 10px 0; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { display: none; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card" id="main-box">
        <h2>你是谁！</h2>
        <div id="quiz-content">
            <div class="question">
                <p>1. 你是书记吗</p >
                <label><input type="radio" name="q1" value="100"> 是</label>
                <label><input type="radio" name="q1" value="2"> 不是</label>
            </div>
            <div class="question">
                <p>2. 你是妈妈吗</p >
                <label><input type="radio" name="q2" value="0">对哟</label>
                <label><input type="radio" name="q2" value="3"> 错啦</label>
            </div>
            <button onclick="showResult()">点击查看解析</button>
        </div>
        <div id="result">
            <h3 id="res-title"></h3>
            <p id="res-desc"></p >
            <button onclick="location.reload()">重新测试</button>
        </div>
    </div>

    <script>
        function showResult() {
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            
            if (!q1 || !q2) {
                alert("请先完成所有题目哦！");
                return;
            }

            let score = parseInt(q1.value) + parseInt(q2.value);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            if (score === 103) {
                document.getElementById('res-title').innerText = "结果：你是书记";
                document.getElementById('res-desc').innerText = "书记傻傻的";
            } else if (score === 2) {
                document.getElementById('res-title').innerText = "结果：妈妈我喜欢你哟";
                document.getElementById('res-desc').innerText = "妈咪~";
            } else {
                document.getElementById('res-title').innerText = "结果：你骗人";
                document.getElementById('res-desc').innerText = "你是小猪";
            }
        }
    </script>
</body>
</html>
